<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <!-- ヘッダー(サロン名 + ナビ)。中身は site.js が描画する。 -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="#top" class="brand" id="brandName"></a>
      <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="サイト内ナビゲーション"></nav>
    </div>
  </header>

  <!-- 各セクションのマウントポイント。site.js が動的に埋める。 -->
  <main id="main" aria-live="polite"></main>

  <!-- フッター。中身は site.js が描画する。 -->
  <footer class="site-footer" id="siteFooter"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
